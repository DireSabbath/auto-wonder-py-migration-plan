services:
  autowonder:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: autowonder
    environment:
      AUTOWONDER_DATABASE_URL: mysql+asyncmy://root:autowonder@mysql:3306/autowonder
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AUTOWONDER_HTTP_PORT: "7002"
      AUTOWONDER_JWT_SECRET: autowonder-dev-jwt-secret-32-bytes
      AUTOWONDER_SECRET_MASTER_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      S3_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: autowonder
      S3_ACCESS_KEY_SECRET: autowonder-secret
      OSS_ENABLED: "false"
    ports:
      - "7002:7002"
    depends_on:
      - mysql
      - redis
      - minio
